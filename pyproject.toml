[project]
name = "club-bot"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "aiogram==3.13.1",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic-settings==2.6.1",
    "apscheduler==3.10.4",
    "psycopg2==2.9.12",
    "python-json-logger==2.0.7"
]

[tool.alembic]
script_location = "migrations"

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
]
